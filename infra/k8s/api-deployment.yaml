apiVersion: apps/v1
kind: Deployment
metadata:
  name: agr-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agr-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agr-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: agr-api
          image: agr-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: agr-config
            - secretRef:
                name: agr-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
