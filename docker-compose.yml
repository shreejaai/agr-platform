services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agr_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agr -d agr_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  agr-api:
    build:
      context: services/agr-api
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agr:password@postgres:5432/agr_dev
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key-not-for-production
      ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/agr-api:/app
      - ./packages:/packages

  agr-dashboard:
    build:
      context: apps/agr-dashboard
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - agr-api

volumes:
  pgdata:
