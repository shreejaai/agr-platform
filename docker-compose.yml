services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agr_svc_usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agr_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agr_svc_usr -d agr_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── One-shot migration runner ───────────────────────────────────────────────
  # Runs migrations 001–025 then exits. agr-api waits for this to complete.

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/migrations:/migrations:ro
      - ./infra/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agr_svc_usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agr_platform}
      POSTGRES_HOST: postgres

  # ── AGR API ────────────────────────────────────────────────────────────────

  agr-api:
    build:
      context: .
      dockerfile: services/agr-api/Dockerfile
    image: agr-api:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agr_svc_usr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agr_platform}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-4e993a8cbcb458e9823be7cc7215d42a57e1e56a3f90e8cdaa9334e9930d8dbf}
      ENV: ${ENV:-development}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:4200}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-sonnet-4-20250514}
      CEDAR_FALLBACK_MODE: ${CEDAR_FALLBACK_MODE:-deny}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Angular Dashboard ──────────────────────────────────────────────────────

  agr-dashboard:
    build:
      context: apps/agr-dashboard
      dockerfile: Dockerfile
      args:
        CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_REPLACE_ME}
    image: agr-dashboard:latest
    ports:
      - "4200:80"
    depends_on:
      agr-api:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-agr_svc_usr}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: 0.0.0.0:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── Temporal Approval Worker (optional) ────────────────────────────────────
  # Processes durable 48h approval workflows. Starts alongside the in-stack
  # Temporal server when the "temporal" profile is active.

  temporal-worker:
    profiles: ["temporal"]
    build:
      context: .
      dockerfile: services/agr-api/Dockerfile
    image: agr-api:latest
    command: ["python", "-m", "app.workers.approval_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agr_svc_usr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agr_platform}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-4e993a8cbcb458e9823be7cc7215d42a57e1e56a3f90e8cdaa9334e9930d8dbf}
      ENV: ${ENV:-development}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      CEDAR_FALLBACK_MODE: ${CEDAR_FALLBACK_MODE:-deny}
    depends_on:
      agr-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
