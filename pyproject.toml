[project]
name = "agr-platform"
version = "0.1.0"
description = "Agentic Governance Runtime — drop-in governance layer for AI agent frameworks"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/agr-api/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
