[project]
name = "agr-platform"
version = "0.1.0"
description = "Agentic Governance Runtime — drop-in governance layer for AI agent frameworks"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["B008", "N999"]

[tool.ruff.lint.per-file-ignores]
"packages/agr-sdk-python/agr/plugins/crewai.py" = ["N802"]
"packages/agr-sdk-python/agr/__init__.py" = ["E501"]
"services/agr-api/app/routes/*" = ["TCH003", "E501"]
"services/agr-api/app/main.py" = ["E501"]
"services/agr-api/app/schemas.py" = ["E501"]
"examples/**" = ["E501", "T201"]
"services/agr-api/tests/postgres/*" = ["TC002", "TC003", "E402", "E501"]
"services/agr-api/app/services/copilot_prompts.py" = ["E501"]
"tools/github-action/validate_policies.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["services/agr-api/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
