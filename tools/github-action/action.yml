name: 'AGR Policy Validator'
description: >
  Validates AGR policy files in your repository against the AGR API and local
  policy engine. Reports syntax errors, policy conflicts, and evaluation-test
  regressions as step annotations.

author: 'Shreeja AI'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  api-key:
    description: 'AGR API key (agr_sk_...). Store as a GitHub secret.'
    required: true

  api-base-url:
    description: 'AGR API base URL. Defaults to https://api.agr.dev'
    required: false
    default: 'https://api.agr.dev'

  policy-dir:
    description: >
      Directory containing .cedar or .yaml policy files to validate.
      Defaults to the repository root.
    required: false
    default: '.'

  dry-run-agent:
    description: >
      Optional fallback agent_id for YAML-configured evaluation tests.
      Used when an evaluation test omits the agent field.
    required: false
    default: ''

  config-file:
    description: >
      Optional YAML config file for changed-only validation and evaluation tests.
      Defaults to .agr-policy-check.yml when present.
    required: false
    default: '.agr-policy-check.yml'

  changed-only:
    description: >
      Validate only policy files changed in the current pull request.
      Requires checkout history deep enough for git diff.
    required: false
    default: 'false'

  fail-on-conflict:
    description: >
      Fail the action if policy conflict detection returns any conflicts.
    required: false
    default: 'true'

  fail-on-violation:
    description: >
      Fail the action when YAML-configured evaluation tests do not match
      their expected decisions.
    required: false
    default: 'true'

outputs:
  validation-result:
    description: 'JSON summary of validation results (valid | invalid | conflicts).'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install validator dependencies
      shell: bash
      run: pip install httpx pyyaml

    - name: Run AGR policy validator
      shell: bash
      env:
        AGR_API_KEY: ${{ inputs.api-key }}
        AGR_BASE_URL: ${{ inputs.api-base-url }}
        POLICY_DIR: ${{ inputs.policy-dir }}
        DRY_RUN_AGENT: ${{ inputs.dry-run-agent }}
        CONFIG_FILE: ${{ inputs.config-file }}
        CHANGED_ONLY: ${{ inputs.changed-only }}
        FAIL_ON_CONFLICT: ${{ inputs.fail-on-conflict }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
      run: python ${{ github.action_path }}/validate_policies.py
