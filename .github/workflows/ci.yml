name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agr
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agr_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://agr:password@localhost:5432/agr_dev
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/agr-api/requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: |
          cd services/agr-api
          python -m pytest tests/unit -v

      - name: Integration tests
        run: |
          cd services/agr-api
          python -m pytest tests/integration -v

  build-dashboard:
    name: Build Angular Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/agr-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/agr-dashboard

      - name: Lint
        run: npm run lint
        working-directory: apps/agr-dashboard

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: apps/agr-dashboard
        continue-on-error: true   # Karma/ChromeHeadless flaky in CI — tracked issue

      - name: Build
        run: npm run build -- --configuration production
        working-directory: apps/agr-dashboard

  test-ts-sdk:
    name: TypeScript SDK — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: packages/agr-sdk-ts

      - name: Type-check
        run: npm run typecheck
        working-directory: packages/agr-sdk-ts

      - name: Test
        run: npm test
        working-directory: packages/agr-sdk-ts

      - name: Build
        run: npm run build
        working-directory: packages/agr-sdk-ts

  deploy:
    name: Deploy to Railway
    needs: [lint-and-test, build-dashboard, test-ts-sdk]
    runs-on: ubuntu-latest
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service agr-api --detach
