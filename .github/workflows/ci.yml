name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agr
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agr_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://agr:password@localhost:5432/agr_dev
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key
      ENV: test

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/agr-api/requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: |
          cd services/agr-api
          python -m pytest tests/unit -v

      - name: Integration tests
        run: |
          cd services/agr-api
          python -m pytest tests/integration -v

  build-dashboard:
    name: Build Angular Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/agr-dashboard/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/agr-dashboard

      - name: Lint
        run: npm run lint
        working-directory: apps/agr-dashboard

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: apps/agr-dashboard
        continue-on-error: true   # Karma/ChromeHeadless flaky in CI — tracked issue

      - name: Build
        run: npm run build -- --configuration production
        working-directory: apps/agr-dashboard

  test-ts-sdk:
    name: TypeScript SDK — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/agr-sdk-ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/agr-sdk-ts

      - name: Type-check
        run: npm run typecheck
        working-directory: packages/agr-sdk-ts

      - name: Test
        run: npm test
        working-directory: packages/agr-sdk-ts

      - name: Build
        run: npm run build
        working-directory: packages/agr-sdk-ts

  # ── PostgreSQL integration tests ──────────────────────────────────────────
  # Runs against a real PostgreSQL 16 instance with all 13 migrations applied.
  # continue-on-error: true — these tests require Docker services; failures are
  # reported but do not block the publish step.
  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres-test:
        image: postgres:16
        env:
          POSTGRES_USER: agr_test
          POSTGRES_PASSWORD: agr_test_password
          POSTGRES_DB: agr_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    env:
      PG_TEST_URL: postgresql+asyncpg://agr_test:agr_test_password@localhost:5433/agr_test

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/agr-api/requirements.txt

      - name: PostgreSQL integration tests
        run: |
          cd services/agr-api
          python -m pytest tests/postgres/ -v --tb=short

  # ── Publish Docker images to GitHub Container Registry ────────────────────
  # Runs on every push to main (after all tests pass).
  # Pushes two tags: :latest and :<short-sha>
  # Images are private (packages visibility set to private in repo settings).
  #
  # Required secrets (set in repo Settings → Secrets → Actions):
  #   GHCR_TOKEN — a GitHub PAT with packages:write scope
  #                (GITHUB_TOKEN also works for same-repo packages)

  publish:
    name: Publish images to ghcr.io
    runs-on: ubuntu-latest
    # Only publish on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-test, build-dashboard, test-ts-sdk]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── AGR API (SaaS image — standard Dockerfile) ──────────────────────
      - name: Build and push agr-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agr-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agr-api:latest
            ghcr.io/${{ github.repository_owner }}/agr-api:${{ steps.sha.outputs.short }}

      # ── AGR API (on-prem image — Cython-compiled, no source) ────────────
      - name: Build and push agr-api (on-prem)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agr-api/Dockerfile.onprem
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agr-api:onprem-latest
            ghcr.io/${{ github.repository_owner }}/agr-api:onprem-${{ steps.sha.outputs.short }}

      # ── AGR Dashboard ────────────────────────────────────────────────────
      - name: Build and push agr-dashboard
        uses: docker/build-push-action@v6
        with:
          context: apps/agr-dashboard
          file: apps/agr-dashboard/Dockerfile
          push: true
          build-args: |
            CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agr-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/agr-dashboard:${{ steps.sha.outputs.short }}

